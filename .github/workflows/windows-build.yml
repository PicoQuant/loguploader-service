name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-specs

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ #
  # No fleet-token-shaped secret may be committed (FR-023, SC-006).    #
  # ------------------------------------------------------------------ #
  no-secret-in-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep tree for a committed fleet token
        shell: bash
        run: |
          set -euo pipefail
          # The example files carry only the literal placeholder.
          if git grep -nI -E 'TELEMETRY_FLEET_TOKENS_[A-Z]+\s*=\s*[A-Za-z0-9._-]{16,}' -- \
               ':!*.example' ':!**/spec*.md' ':!**/research.md' ; then
            echo "::error::a fleet-token-shaped value is committed to the tree"
            exit 1
          fi
          echo "no committed token found"

  build:
    needs: no-secret-in-source
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [luminosa, solira]
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned MSRV toolchain, msvc target)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc -V ; cargo -V

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: fmt + clippy (once is enough, but cheap)
        if: matrix.product == 'luminosa' && matrix.channel == 'stable'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Build ${{ matrix.product }} / ${{ matrix.channel }}
        shell: pwsh
        env:
          PQ_PRODUCT: ${{ matrix.product }}
          PQ_CHANNEL: ${{ matrix.channel }}
          # secrets are named exactly like the backend variable (FR-024).
          TELEMETRY_FLEET_TOKENS_LUMINOSA: ${{ secrets.TELEMETRY_FLEET_TOKENS_LUMINOSA }}
          TELEMETRY_FLEET_TOKENS_SOLIRA: ${{ secrets.TELEMETRY_FLEET_TOKENS_SOLIRA }}
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Name the artifact per contracts/cli.md
        id: name
        shell: pwsh
        run: |
          $suffix = if ($env:MATRIX_CHANNEL -eq 'beta') { '-beta' } else { '' }
          $exe = "pquploader-$($env:MATRIX_PRODUCT)$suffix.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/pquploader.exe" $exe
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          MATRIX_PRODUCT: ${{ matrix.product }}
          MATRIX_CHANNEL: ${{ matrix.channel }}

      - name: Run tests (mock backend only; no secret needed)
        if: matrix.channel == 'stable'
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-${{ matrix.channel }}
          path: ${{ steps.name.outputs.exe }}
