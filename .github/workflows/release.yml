name: Release (Windows)

# NOTE: the channel / prerelease / rollback-composition rules and the ISCC+cargo matrix are
# OWNED by specs/001-v2-remote-upgrade (its T048). This file is the minimal v2 release path
# so the agent can ship before spec 001 lands; keep the artifact names matching
# specs/002-v2-config-backup-telemetry/contracts/cli.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  no-secret-in-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep tree for a committed fleet token
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E 'TELEMETRY_FLEET_TOKENS_[A-Z]+\s*=\s*[A-Za-z0-9._-]{16,}' -- \
               ':!*.example' ':!**/spec*.md' ':!**/research.md' ; then
            echo "::error::a fleet-token-shaped value is committed to the tree"; exit 1
          fi

  build-and-release:
    needs: no-secret-in-source
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [luminosa, solira]
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Is this tag a beta? (vX.Y.Z-beta.N)
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      # Build a (product, channel) row only when: its channel matches the tag kind AND the
      # product's fleet-token secret is configured (an unset token would hard-fail the
      # release build by design — FR-024).
      - name: Gate this matrix row
        id: gate
        shell: bash
        env:
          TOK_LUMINOSA: ${{ secrets.TELEMETRY_FLEET_TOKENS_LUMINOSA }}
          TOK_SOLIRA: ${{ secrets.TELEMETRY_FLEET_TOKENS_SOLIRA }}
        run: |
          want_beta='${{ steps.tag.outputs.is_beta }}'
          have_beta=$([[ '${{ matrix.channel }}' == 'beta' ]] && echo true || echo false)
          case '${{ matrix.product }}' in
            luminosa) tok="$TOK_LUMINOSA" ;;
            solira)   tok="$TOK_SOLIRA" ;;
          esac
          if [[ "$want_beta" == "$have_beta" && -n "$tok" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            [[ -z "$tok" ]] && echo "::notice::skipping ${{ matrix.product }} — TELEMETRY_FLEET_TOKENS_$(echo ${{ matrix.product }} | tr a-z A-Z) not set"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - name: Build ${{ matrix.product }} / ${{ matrix.channel }}
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        env:
          PQ_PRODUCT: ${{ matrix.product }}
          PQ_CHANNEL: ${{ matrix.channel }}
          TELEMETRY_FLEET_TOKENS_LUMINOSA: ${{ secrets.TELEMETRY_FLEET_TOKENS_LUMINOSA }}
          TELEMETRY_FLEET_TOKENS_SOLIRA: ${{ secrets.TELEMETRY_FLEET_TOKENS_SOLIRA }}
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Assemble artifacts (contracts/cli.md names)
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffixDash = if ($env:CH -eq 'beta') { '-beta' } else { '' }
          $exe = "pquploader-$($env:PROD)$suffixDash.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/pquploader.exe" $exe

          $iss = "installer/v2/$($env:PROD)$suffixDash.iss"
          $version = (Get-Content VERSION).Trim()
          $outDir = Join-Path $PWD 'Output'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $iscc = Get-ChildItem -Path 'C:\Program Files*\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' | Select-Object -First 1 }

          & $iscc.FullName "/DMyAppVersion=$version" "/DMyBinary=..\..\$exe" "/O$outDir" $iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

          $installer = Get-ChildItem $outDir -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "no installer produced in $outDir" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii -NoNewline
        env:
          PROD: ${{ matrix.product }}
          CH: ${{ matrix.channel }}

      - name: Upload to the Release
        if: steps.gate.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # beta tag -> prerelease, never "Latest": the fielded v1 fleet updates from
          # /releases/latest and must not see this (Constitution VI, staged rollout).
          prerelease: ${{ steps.tag.outputs.is_beta == 'true' }}
          make_latest: ${{ steps.tag.outputs.is_beta == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            pquploader-${{ matrix.product }}*.exe
            Output/*Setup.exe
            Output/*Setup.exe.sha256
          generate_release_notes: true
